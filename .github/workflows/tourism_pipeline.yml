name: Tourism MLOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tourism-ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify project files
        run: |
          test -f tourism_project/data/tourism.csv
          test -f tourism_project/scripts/prep.py
          test -f tourism_project/scripts/train.py

      - name: Prepare data
        run: python tourism_project/scripts/prep.py

      - name: Train and evaluate model
        run: python tourism_project/scripts/train.py

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tourism-mlops-artifacts
          if-no-files-found: warn
          path: |
            tourism_project/artifacts/train.csv
            tourism_project/artifacts/test.csv
            tourism_project/artifacts/reports/
            tourism_project/deployment/tourism_model.joblib
